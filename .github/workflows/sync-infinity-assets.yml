name: Sync Infinity Sketcher assets

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/sync-infinity-assets.yml'
      - 'assets/infinity-sketcher/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout portfolio
        uses: actions/checkout@v4
      - name: Checkout Infinity Sketcher
        uses: actions/checkout@v4
        with:
          repository: Rutu2701/Infinity-Sketcher
          path: infinity-source
          ref: main
          token: ''
          persist-credentials: false
      - name: Copy project assets
        run: |
          mkdir -p assets/infinity-sketcher
          cp infinity-source/docs/images/vehicle.png assets/infinity-sketcher/vehicle.png
          cp infinity-source/docs/images/gui.svg assets/infinity-sketcher/gui.svg
          file assets/infinity-sketcher/vehicle.png assets/infinity-sketcher/gui.svg
      - name: Commit local assets
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/infinity-sketcher/vehicle.png assets/infinity-sketcher/gui.svg
          git diff --cached --quiet || git commit -m 'Sync Infinity Sketcher images locally'
          git push