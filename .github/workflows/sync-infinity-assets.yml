name: Sync Infinity Sketcher assets

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/sync-infinity-assets.yml'
      - 'assets/infinity-sketcher/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download project assets
        run: |
          mkdir -p assets/infinity-sketcher
          curl -L --fail --retry 3 -H 'Accept: application/vnd.github.raw+json' -o assets/infinity-sketcher/vehicle.png https://api.github.com/repos/Rutu2701/Infinity-Sketcher/git/blobs/b3f5ce7a373a14948198d34379983863590b0cd1
          curl -L --fail --retry 3 -H 'Accept: application/vnd.github.raw+json' -o assets/infinity-sketcher/gui.svg https://api.github.com/repos/Rutu2701/Infinity-Sketcher/git/blobs/82c1c6cd5c4634ae21128c7dc455ec3696766841
          file assets/infinity-sketcher/vehicle.png assets/infinity-sketcher/gui.svg
      - name: Commit local assets
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/infinity-sketcher/vehicle.png assets/infinity-sketcher/gui.svg
          git diff --cached --quiet || git commit -m 'Sync Infinity Sketcher images locally'
          git push